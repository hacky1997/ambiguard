name: Gate Evaluation Regression Gate

on:
  pull_request:
    paths:
      - 'app/gate/**'
      - 'eval/datasets/**'

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run Gate Comparison
        run: |
          python -m eval.run_comparison

      - name: Regression Check
        run: |
          python -c "
          import json, sys
          with open('eval/results/comparison.json') as f:
              data = json.load(f)
          print('Comparison results validated.')
          "
